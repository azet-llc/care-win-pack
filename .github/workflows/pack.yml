name: pack
on:
  push:
    branches: [main]
env:
  V: "0.1.3"
  GH_TOKEN: ${{ github.token }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Signed installer
        run: |
          gh release download "inputs-$env:V" --repo $env:GITHUB_REPOSITORY -p "*setup.exe" -D dl
          $f = (Get-ChildItem dl\*setup.exe)[0].FullName
          $s = Get-AuthenticodeSignature $f; "installer: $($s.Status) $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { exit 1 }
          "SETUP=$f" >> $env:GITHUB_ENV
      - name: Silent install, signatures of installed exe files
        run: |
          $p = Start-Process $env:SETUP -ArgumentList '/S' -Wait -PassThru; "installer exit $($p.ExitCode)"
          $dir = "$env:LOCALAPPDATA\AZET Care for Windows"
          Get-ChildItem $dir -Recurse -Include *.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "$($s.Status) $($_.FullName.Substring($dir.Length))" ; if ($s.Status -ne 'Valid') { exit 1 } }
          $v = (Get-Item "$dir\azet-care-win.exe").VersionInfo.ProductVersion; "version $v"; if ($v -ne $env:V) { exit 1 }
          "DIR=$dir" >> $env:GITHUB_ENV
      - name: First launch stays up, window title
        run: |
          $p = Start-Process "$env:DIR\azet-care-win.exe" -PassThru
          Start-Sleep 20
          $q = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $q) { "app exited"; exit 1 }
          "running pid $($q.Id) title '$($q.MainWindowTitle)' ws $([int]($q.WorkingSet64/1MB))MB"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null; $bmp.Save("$PWD\shots\first-launch.png")
          Stop-Process -Id $q.Id
      - name: Uninstall
        run: |
          $u = "$env:DIR\uninstall.exe"
          Start-Process $u -ArgumentList '/S' -Wait; Start-Sleep 5
          if (Test-Path "$env:DIR\azet-care-win.exe") { "still installed"; exit 1 } else { "removed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
          retention-days: 3
